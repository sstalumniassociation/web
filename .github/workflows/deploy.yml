name: Deploy

on:
  push:
    branches:
      - wipwip
    tags:
      - 'v*'
  workflow_dispatch: { }

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_METRO: sin0

jobs:
  deploy:
    permissions:
      packages: write
      contents: read
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker meta
        uses: docker/metadata-action@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to OCI registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: unikraft/kraftkit@stable
        with:
          run: |
            kraft cloud deploy \
              -K ./kraft.admin.yml \
              --rootfs ./Dockerfile.admin \
              --rollout remove \
              -g sstaa-admin-api \
              -M 512 \
              -e ConnectionStrings__sstaa='${{ secrets.ConnectionStrings__sstaa }}' \
              -e Firebase__ProjectId='sstaa-app' \
              -e DOTNET_URLS='http://0.0.0.0:5000'
